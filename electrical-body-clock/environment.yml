name: electrical-body-clock
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.26,<3
  - scipy>=1.11
  - pandas>=2.0
  - scikit-learn>=1.3
  - matplotlib>=3.8
  - seaborn>=0.13
  - pip
  - pip:
      # ECG signal processing (Act I)
      - wfdb>=4.1          # PhysioNet waveform I/O (PTB-XL)
      - neurokit2>=0.2.7   # ECG delineation (P/QRS/T fiducials)
      - torch>=2.2         # 1D CNN subsystem clocks (weights_only load)
      # survival + statistics (Act II mortality, NHANES survey Cox)
      - lifelines>=0.30    # Cox proportional-hazards
      - statsmodels>=0.14  # survey/logistic models (Chapman, MotionVector, NHANES)
      - xgboost>=2.0       # gradient-boosted interval-biomarker baseline
      # data I/O
      - pyreadstat>=1.2    # NHANES .XPT (SAS transport) reader
      - pyarrow>=14        # parquet result tables
      - h5py>=3.8          # HDF5 (imaging/feature tables)
      - requests>=2.28     # dataset download scripts
      - tqdm>=4.65
