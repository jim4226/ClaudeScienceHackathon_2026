name: CI

# Verifies the frozen, released artifacts and the live demo from a clean checkout.
# No restricted data is needed: `make verify` checks the frozen scorer, the
# claim-to-artifact ledger and the SHA-256 manifest; `make demo-smoke` runs the
# demo end-to-end on CPU without launching a server.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify frozen artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install minimal deps
        run: python -m pip install --upgrade pip "numpy>=1.26,<3" "scipy>=1.11"
      - name: make verify
        run: make verify

  demo-smoke:
    name: demo smoke test (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-demo-${{ hashFiles('electrical-body-clock/demo/hf_space/requirements.txt') }}
      - name: Install demo deps (CPU torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r electrical-body-clock/demo/hf_space/requirements.txt
      - name: make demo-smoke
        run: make demo-smoke
